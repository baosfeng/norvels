# Dependabot：依赖更新 PR。
#
# 两路 weekly：Go modules（go.mod/go.sum）与 GitHub Actions（uses: 里的 action 版本）。
# 自动 PR 同样会跑 ci.yml 的四个 job，不达标的更新会被挡在合并之外。
version: 2
updates:
  # Go 依赖：modernc.org/sqlite 等升级后需重跑全量门禁确认兼容。
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go

  # GitHub Actions：保持 setup-go / buildx / metadata 等 action 为当前主版本。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
