# 镜像构建验证：main 每次通过 CI 后，按发版同款参数把多架构镜像构建一遍，**不推送**。
#
# 存在的理由：release/edge 里的 docker/*、checkout、distroless digest 等升级，
# PR 的 CI 根本跑不到（它们只在打 tag 或推 main 时才执行）。这里在 main 上真构建一次，
# 能在发版前拦住"Dockerfile 编不过 / 基础镜像 digest 失效"这类问题。
#
# 不产生任何 tag：Docker Hub 上只允许"完整版本号 + latest"形态，
# x.y / x / sha-* / edge 这类滚动标签已清理并停止生成。
#
# 不需要任何 secret（push: false）。
name: 镜像构建验证

on:
  push:
    branches: [main]
  # 支持手动补推（例如需要把某个历史提交重推为 edge 时由维护者触发）。
  workflow_dispatch:

permissions:
  contents: read

# main 上连续推送时只保留最新一次，避免旧提交把 edge 覆盖回去。
concurrency:
  group: edge
  cancel-in-progress: true

env:
  IMAGE_NAME: bsfeng/norvels

jobs:
  ci:
    name: CI（edge 前门禁）
    uses: ./.github/workflows/ci.yml

  docker:
    name: 构建镜像（不推送）
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v4
      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 计算构建时间戳
        id: buildinfo
        run: echo "builtat=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=norvels
            org.opencontainers.image.version=edge
            org.opencontainers.image.description=本地中文小说库：导入、阅读、全文搜索

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          # 只验证能构建，不推送：本 workflow 不产生任何镜像 tag。
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
            BUILTAT=${{ steps.buildinfo.outputs.builtat }}
          # 与 release.yml 同口径：带 SBOM、复用 gha 缓存（mode=max 含中间层）。
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
