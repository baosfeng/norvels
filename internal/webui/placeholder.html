<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>norvels · 前端未构建</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e6e6e6;font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      .card{max-width:640px;padding:40px 36px;border-radius:16px;background:#171a21;box-shadow:0 12px 40px rgba(0,0,0,.45)}
      h1{margin:0 0 12px;font-size:20px}
      code{background:#0b0d11;padding:2px 6px;border-radius:6px;color:#7cd4a0}
      a{color:#7c9cff}
      ol{padding-left:20px;margin:12px 0}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>前端产物尚未构建</h1>
      <p>服务端已启动，但 <code>internal/webui/dist</code> 里没有前端文件。请执行以下任一方式构建：</p>
      <ol>
        <li><code>make web</code>（构建前端并同步到 internal/webui/dist）</li>
        <li><code>cd web &amp;&amp; pnpm install &amp;&amp; pnpm build</code>，然后 <code>cp -R web/dist/* internal/webui/dist/</code></li>
      </ol>
      <p>API 本身可用，试试 <a href="/api/health">/api/health</a>、<a href="/api/stats">/api/stats</a>、<a href="/api/books">/api/books</a>。</p>
    </div>
  </body>
</html>
