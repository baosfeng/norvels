# norvels NAS 部署编排（飞牛 fnOS / 群晖 / 威联通等 x86 或 arm64 设备）
#
# 与 deploy/compose.yml 的区别：这里面向"镜像已经发布、机器上没有源码"的部署，
# 数据卷用绝对路径（NAS 上通常落在独立数据盘），并附带 .env 与 update.sh。
#
# 首次部署、更新、备份的完整步骤见同目录 README.md。

name: norvels

services:
  norvels:
    # 生产请钉具体版本；latest 仅用于第一次试装。
    image: bsfeng/norvels:${NORVELS_VERSION:-latest}
    container_name: norvels
    ports:
      - "${NORVELS_PORT:-8080}:8080"
    environment:
      NORVELS_ADDR: ":8080"
      NORVELS_DB: "/data/norvels.db"
      # 正文库固定在 /content 挂载点下：后端按这个绝对路径打开，不再由主库路径推导兄弟文件。
      NORVELS_CONTENT_DB: "/content/norvels-content.db"
      NORVELS_HEALTH_URL: "http://127.0.0.1:8080/api/health"
      TZ: "${TZ:-Asia/Shanghai}"
      # 鉴权：不设口令时绑 0.0.0.0 会被拒绝启动（默认拒绝开放 + 非回环）。
      # 公网/共享网络设一串随机值；只在可信内网用则设 NORVELS_ALLOW_PUBLIC=1。
      NORVELS_AUTH_TOKEN: "${NORVELS_AUTH_TOKEN:-}"
      NORVELS_ALLOW_PUBLIC: "${NORVELS_ALLOW_PUBLIC:-}"
      # 存量书回填分类（0015 迁移用）：不设时落「未分类」。
      NORVELS_LEGACY_CATEGORY: "${NORVELS_LEGACY_CATEGORY:-}"
    volumes:
      # 数据库目录：SQLite 主库 + WAL + SHM 都在这里。
      # 放独立数据盘（如 /vol1/norvels/data），不要放在系统分区。
      - "${NORVELS_DATA_DIR:-./data}:/data"
      # 正文库目录：正文库（norvels-content.db，生产约 160 GB）可独立放另一块盘（如机械盘 /vol3）。
      # 不设 NORVELS_CONTENT_DIR 时它等于 NORVELS_DATA_DIR，即 /content 与 /data 指向同一宿主目录、
      # 行为与分离前完全一致；改设后两个挂载点分别指向两块盘，跨盘的文件操作不能用 mv/cp -a 之外的假设。
      - "${NORVELS_CONTENT_DIR:-${NORVELS_DATA_DIR:-./data}}:/content"
      # 小说 txt 源目录，只读挂载，导入新书时才会用到；不导入可以留空目录。
      - "${NORVELS_BOOKS_DIR:-./books}:/books:ro"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      # 首次启动若需要跑 schema 迁移，60s 可能不够；update.sh 会先单独跑迁移，
      # 所以这里保持 60s 即可，避免"迁移中 → unhealthy → 重启 → 迁移重来"。
      start_period: 60s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s
    # 内存上限（软兜底）：这里**不是**限制应用能用多少内存，而是给内核一个明确的
    # 回收边界——cgroup 到顶时优先回收 page cache，而不是把进程页换进 swap。
    # 浏览/阅读实测：进程 RSS 约 100–200 MB（页缓存上限已降到三库共 24 条连接 × 16 MiB），
    # 768M 留足余量又不至于让冷页面长期赖在内存里。大库首次全量导入时改成 2G，
    # 需要限 CPU 再加一行 cpus: "2.0"。
    deploy:
      resources:
        limits:
          memory: ${NORVELS_MEM_LIMIT:-768M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
